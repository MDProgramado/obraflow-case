# ===========================================
# Render Blueprint (Infrastructure as Code)
# ===========================================
# Save this as render.yaml in repo root
# Deploy: Render Dashboard > New > Blueprint > Select repo

services:
  # -----------------------------------------
  # PostgreSQL Database
  # -----------------------------------------
  - type: pserv
    name: obraflow-db
    env: postgres
    plan: starter
    databaseName: obraflow
    user: obraflow
    # PostgreSQL version: 16
    # Region: Oregon (US West) or Frankfurt (EU Central)

  # -----------------------------------------
  # Backend - Spring Boot (Docker)
  # -----------------------------------------
  - type: web
    name: obraflow-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      # Database connection (auto-injected from database service)
      - fromDatabase:
          name: obraflow-db
          property: host
        key: DB_HOST
      - fromDatabase:
          name: obraflow-db
          property: port
        key: DB_PORT
      - fromDatabase:
          name: obraflow-db
          property: databaseName
        key: DB_NAME
      - fromDatabase:
          name: obraflow-db
          property: user
        key: DB_USER
      - fromDatabase:
          name: obraflow-db
          property: password
        key: DB_PASS
      # JWT Secret (auto-generated secure secret)
      - key: OBRAFLOW_JWT_SECRET
        generateValue: true
      # Optional: Java memory tuning
      - key: JAVA_OPTS
        value: "-Xms512m -Xmx1024m -XX:+UseG1GC"

  # -----------------------------------------
  # Frontend - Next.js (Node.js Web Service)
  # -----------------------------------------
  - type: web
    name: obraflow-frontend
    env: node
    plan: starter
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      # Backend URL (auto-injected from backend service)
      - key: BACKEND_URL
        fromService:
          name: obraflow-backend
          type: web
          property: host
      # NextAuth configuration
      - key: NEXTAUTH_URL
        value: https://obraflow-frontend.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://obraflow-frontend.onrender.com
      # Node.js production settings
      - key: NODE_ENV
        value: production

# -----------------------------------------
# Optional: Redis for caching/sessions (future)
# -----------------------------------------
# - type: redis
#   name: obraflow-redis
#   plan: starter
#   maxmemoryPolicy: allkeys-lru